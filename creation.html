<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Créer une organisation — Pôle Illégal</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(21,151,255,0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(233,120,255,0.13),
                    transparent 30%
                ),
                #05070d;

            color: #f5f7ff;

            min-height: 100vh;
        }


        header {

            padding: 18px 20px;

            border-bottom:
                1px solid rgba(255,255,255,0.07);

            background:
                rgba(5,7,13,0.85);

            backdrop-filter: blur(15px);
        }


        .navbar {

            max-width: 900px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {

            font-weight: bold;

            letter-spacing: 2px;
        }


        .logo span {

            background:
                linear-gradient(
                    90deg,
                    #65e6ff,
                    #1597ff,
                    #e978ff
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .back {

            color: #65e6ff;

            text-decoration: none;

            font-size: 14px;
        }


        main {

            max-width: 900px;

            margin: auto;

            padding: 55px 20px;
        }


        .title {

            margin-bottom: 30px;
        }


        .badge {

            display: inline-block;

            padding: 7px 13px;

            border-radius: 50px;

            border:
                1px solid rgba(101,230,255,0.25);

            color: #65e6ff;

            background:
                rgba(101,230,255,0.06);

            font-size: 12px;

            margin-bottom: 18px;
        }


        h1 {

            font-size: 42px;

            margin-bottom: 10px;
        }


        .title p {

            color: #858b9a;

            line-height: 1.6;
        }


        .form-card {

            background:
                rgba(12,15,24,0.82);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 18px;

            padding: 30px;
        }


        .form-group {

            margin-bottom: 22px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;
        }


        .required {

            color: #65e6ff;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border:
                1px solid rgba(255,255,255,0.08);

            background:
                rgba(5,7,13,0.8);

            color: white;

            outline: none;

            font-family: Arial, sans-serif;

            font-size: 14px;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color:
                rgba(101,230,255,0.5);

            box-shadow:
                0 0 0 3px rgba(101,230,255,0.05);
        }


        textarea {

            min-height: 130px;

            resize: vertical;
        }


        select {

            cursor: pointer;
        }


        select option {

            background: #0c0f18;

            color: white;
        }


        .help {

            margin-top: 7px;

            color: #626978;

            font-size: 12px;

            line-height: 1.5;
        }


        .buttons {

            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 30px;
        }


        .button {

            display: inline-block;

            padding: 13px 20px;

            border-radius: 10px;

            border: none;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;

            cursor: pointer;

            transition: 0.2s;
        }


        .cancel {

            background:
                rgba(255,255,255,0.05);

            color: #9ca3b2;

            border:
                1px solid rgba(255,255,255,0.08);
        }


        .cancel:hover {

            color: white;

            background:
                rgba(255,255,255,0.08);
        }


        .submit {

            color: white;

            background:
                linear-gradient(
                    90deg,
                    #1597ff,
                    #8d70ff,
                    #e978ff
                );
        }


        .submit:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(141,112,255,0.25);
        }


        .message {

            display: none;

            margin-top: 20px;

            padding: 14px;

            border-radius: 10px;

            background:
                rgba(60,220,150,0.08);

            border:
                1px solid rgba(60,220,150,0.2);

            color: #6ee7b7;

            font-size: 14px;
        }


        footer {

            text-align: center;

            padding: 40px 20px;

            color: #505665;

            font-size: 12px;
        }


        @media(max-width:650px) {

            main {

                padding:
                    40px 15px;
            }


            h1 {

                font-size: 34px;
            }


            .form-card {

                padding: 22px;
            }


            .buttons {

                flex-direction: column;
            }


            .button {

                text-align: center;

                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="navbar">

        <div class="logo">

            PÔLE
            <span>ILLÉGAL</span>

        </div>


        <a
            href="organisations.html"
            class="back"
        >

            ← Organisations

        </a>

    </div>

</header>



<main>


    <section class="title">

        <div class="badge">

            🏢 NOUVELLE ORGANISATION

        </div>


        <h1>

            Créer une organisation

        </h1>


        <p>

            Remplissez les informations ci-dessous
            pour créer un nouveau dossier.

        </p>

    </section>



    <section class="form-card">


        <form id="organisationForm">


            <!-- NOM -->

            <div class="form-group">

                <label for="nom">

                    Nom de l'organisation
                    <span class="required">*</span>

                </label>


                <input
                    type="text"
                    id="nom"
                    name="nom"
                    placeholder="Ex : Los Santos Vagos"
                    required
                >

            </div>



            <!-- TYPE -->

            <div class="form-group">

                <label for="type">

                    Type d'organisation
                    <span class="required">*</span>

                </label>


                <select
                    id="type"
                    name="type"
                    required
                >

                    <option value="">
                        Sélectionnez un type
                    </option>

                    <option value="gang">
                        Gang
                    </option>

                    <option value="mafia">
                        Mafia
                    </option>

                    <option value="entreprise">
                        Entreprise
                    </option>

                    <option value="autre">
                        Autre
                    </option>

                </select>

            </div>



            <!-- RESPONSABLE -->

            <div class="form-group">

                <label for="responsable">

                    Responsable

                </label>


                <input
                    type="text"
                    id="responsable"
                    name="responsable"
                    placeholder="Nom / Identifiant RP"
                >

            </div>



            <!-- STATUT -->

            <div class="form-group">

                <label for="statut">

                    Statut

                    <span class="required">*</span>

                </label>


                <select
                    id="statut"
                    name="statut"
                    required
                >

                    <option value="active">
                        Active
                    </option>

                    <option value="attente">
                        En attente
                    </option>

                    <option value="suspendue">
                        Suspendue
                    </option>

                </select>

            </div>



            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">

                    Description

                </label>


                <textarea
                    id="description"
                    name="description"
                    placeholder="Décrivez l'organisation..."
                ></textarea>


                <div class="help">

                    Cette description pourra être
                    modifiée ultérieurement.

                </div>

            </div>



            <!-- BOUTONS -->

            <div class="buttons">

                <a
                    href="organisations.html"
                    class="button cancel"
                >

                    Annuler

                </a>


                <button
                    type="submit"
                    class="button submit"
                >

                    Créer l'organisation

                </button>

            </div>


            <div
                id="message"
                class="message"
            >

                Organisation créée avec succès.

            </div>


        </form>


    </section>


</main>



<footer>

    Pôle Illégal — Administration RP

</footer>



<script>

    const form =
        document.getElementById("organisationForm");


    form.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            // Récupération des informations

            const nom =
                document.getElementById("nom")
                    .value
                    .trim();


            const type =
                document.getElementById("type")
                    .value;


            const responsable =
                document.getElementById("responsable")
                    .value
                    .trim();


            const statut =
                document.getElementById("statut")
                    .value;


            const description =
                document.getElementById("description")
                    .value
                    .trim();


            // Vérification du nom

            if (!nom) {

                alert(
                    "Veuillez renseigner le nom de l'organisation."
                );

                return;
            }


            // Récupération des organisations existantes

            let organisations =
                JSON.parse(
                    localStorage.getItem(
                        "organisations"
                    )
                ) || [];


            // Création de l'organisation

            const organisation = {

                id:
                    Date.now(),

                nom:
                    nom,

                type:
                    type,

                responsable:
                    responsable,

                statut:
                    statut,

                description:
                    description,

                dateCreation:
                    new Date().toLocaleDateString(
                        "fr-FR"
                    )

            };


            // Ajout à la liste

            organisations.push(
                organisation
            );


            // Sauvegarde

            localStorage.setItem(
                "organisations",
                JSON.stringify(
                    organisations
                )
            );


            // Message

            alert(
                "Organisation créée avec succès !"
            );


            // Retour vers la liste

            window.location.href =
                "organisations.html";

        }
    );

</script>


</body>

</html>
