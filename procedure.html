<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #05070D;
    color: #F5F7FF;
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 15% 20%, #1597FF22, transparent 35%),
        radial-gradient(circle at 85% 70%, #E978FF20, transparent 35%);
    pointer-events: none;
    z-index: -1;
}

header {
    padding: 25px 7%;
    border-bottom: 1px solid #1597FF55;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #65E6FF;
    letter-spacing: 2px;
}

.back {
    text-decoration: none;
    color: #F5F7FF;
    border: 1px solid #B99CFF88;
    padding: 10px 16px;
    border-radius: 10px;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
    padding: 55px 0;
}

.badge {
    display: inline-block;
    color: #E978FF;
    border: 1px solid #E978FF88;
    padding: 8px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
    font-size: 13px;
}

h1 {
    font-size: clamp(36px, 7vw, 65px);
    background: linear-gradient(90deg, #1597FF, #65E6FF, #E978FF, #B99CFF);
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 15px;
}

.intro {
    color: #b9bfd2;
    max-width: 750px;
    line-height: 1.7;
    margin-bottom: 45px;
}

.steps {
    display: grid;
    gap: 18px;
}

.step {
    display: grid;
    grid-template-columns: 75px 1fr;
    gap: 20px;
    align-items: center;
    background: #0a0e18;
    border: 1px solid #1597FF44;
    border-radius: 18px;
    padding: 22px;
    transition: .3s;
}

.step:hover {
    border-color: #65E6FF;
    transform: translateX(5px);
}

.number {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1597FF18;
    border: 1px solid #1597FF88;
    color: #65E6FF;
    font-size: 20px;
    font-weight: bold;
}

.step h2 {
    color: #F5F7FF;
    margin-bottom: 7px;
}

.step p {
    color: #b9bfd2;
    line-height: 1.6;
    font-size: 14px;
}
