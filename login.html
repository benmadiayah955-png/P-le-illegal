<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Pôle Illégal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #05070D;
      color: #F5F7FF;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(15, 20, 35, 0.95);
      border: 1px solid #1597FF;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(21,151,255,.25);
    }

    .logo {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      color: #65E6FF;
      margin-bottom: 10px;
    }

    p {
      color: #B99CFF;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    a {
      display: block;
      padding: 15px;
      border-radius: 12px;
      background: #5865F2;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: .2s;
    }

    a:hover {
      transform: scale(1.02);
    }

    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #8d94a8;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="logo">🔐</div>

    <h1>𝐏𝐨̂𝐥𝐞 𝐈𝐥𝐥𝐞́𝐠𝐚𝐥</h1>

    <p>
      La connexion Discord est obligatoire pour accéder au site.
    </p>

    <a href="/api/auth/discord">
      Se connecter avec Discord
    </a>

    <div class="info">
      Accès réservé aux utilisateurs authentifiés.
    </div>
  </div>

</body>
</html>
